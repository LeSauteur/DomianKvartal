name: SEO QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node _tools/sync-public-header.mjs --check
      - run: npm run seo:audit
      - run: npx playwright test tests/service-pages.spec.js tests/public-header.spec.js tests/lead-form.spec.js tests/reanimation.spec.js
