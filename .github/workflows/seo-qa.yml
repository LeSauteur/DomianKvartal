name: SEO QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:static
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: npm run check:artifact -- _site
      - uses: actions/upload-artifact@v4
        with:
          name: pages-file-inventory
          path: output/pages-artifact-files.json
          if-no-files-found: error
      - run: npm run test:browser
        env:
          VISUAL_TOP_QA: '1'
