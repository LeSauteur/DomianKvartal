<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Иллюстративное фото для витринной карточки">
  <rect width="1200" height="900" fill="#eef2e8"/>
  <rect x="90" y="90" width="1020" height="720" rx="28" fill="#ffffff" stroke="#cedcc5" stroke-width="4"/>
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="44" fill="#283322">Витринная подборка</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="34" fill="#536249">Одноэтажный дом</text>
  <text x="120" y="310" font-family="Arial, sans-serif" font-size="30" fill="#6e7d64">Аксай, район ул. Речников</text>
  <text x="120" y="700" font-family="Arial, sans-serif" font-size="24" fill="#7c8b72">Фото-заглушка. Заменить на иллюстративную визуализацию.</text>
</svg>
