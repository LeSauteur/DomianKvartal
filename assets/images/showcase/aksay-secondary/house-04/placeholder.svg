<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Иллюстративное фото для витринной карточки">
  <rect width="1200" height="900" fill="#f3eee9"/>
  <rect x="90" y="90" width="1020" height="720" rx="28" fill="#ffffff" stroke="#dacdc1" stroke-width="4"/>
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="44" fill="#342b24">Витринная подборка</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="34" fill="#64574d">Домовой формат</text>
  <text x="120" y="310" font-family="Arial, sans-serif" font-size="30" fill="#7c6e64">Аксай, район ул. Платова</text>
  <text x="120" y="700" font-family="Arial, sans-serif" font-size="24" fill="#8b7c72">Фото-заглушка. Заменить на иллюстративную визуализацию.</text>
