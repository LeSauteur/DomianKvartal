<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Иллюстративное фото для витринной карточки">
  <rect width="1200" height="900" fill="#eef3ef"/>
  <rect x="90" y="90" width="1020" height="720" rx="28" fill="#ffffff" stroke="#c9d8cc" stroke-width="4"/>
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="44" fill="#253229">Витринная подборка</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="34" fill="#4f5f54">1-комнатная квартира</text>
  <text x="120" y="310" font-family="Arial, sans-serif" font-size="30" fill="#6b7a70">Аксай, район ул. Платова</text>
  <text x="120" y="700" font-family="Arial, sans-serif" font-size="24" fill="#7b897f">Фото-заглушка. Заменить на иллюстративную визуализацию.</text>
</svg>
