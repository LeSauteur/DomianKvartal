<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Иллюстративное фото для витринной карточки">
  <rect width="1200" height="900" fill="#f6f1ec"/>
  <rect x="90" y="90" width="1020" height="720" rx="28" fill="#ffffff" stroke="#ddcfc3" stroke-width="4"/>
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="44" fill="#312921">Витринная подборка</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="34" fill="#62564c">Бюджетная 1-комнатная</text>
  <text x="120" y="310" font-family="Arial, sans-serif" font-size="30" fill="#7d6e62">Аксай, район ул. Вартанова</text>
  <text x="120" y="700" font-family="Arial, sans-serif" font-size="24" fill="#8a7b70">Фото-заглушка. Заменить на иллюстративную визуализацию.</text>
</svg>
