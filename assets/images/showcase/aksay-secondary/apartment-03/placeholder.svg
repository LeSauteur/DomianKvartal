<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Иллюстративное фото для витринной карточки">
  <rect width="1200" height="900" fill="#eef2f6"/>
  <rect x="90" y="90" width="1020" height="720" rx="28" fill="#ffffff" stroke="#cbd6df" stroke-width="4"/>
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="44" fill="#26313d">Витринная подборка</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="34" fill="#506070">Просторная 1-комнатная</text>
