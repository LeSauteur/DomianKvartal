          - generic [ref=f2e274]: Вторичный рынок Аксая
          - 'heading "Квартиры в Аксае на вторичном рынке: где искать и как выбрать" [level=2] [ref=f2e275]'
          - paragraph [ref=f2e276]: "На вторичном рынке Аксая одновременно представлены компактные квартиры, семейные форматы и свежая вторичка в сданных жилых комплексах. Выбирать стоит не только по площади и цене: важны конкретная улица, состояние дома, ежедневный маршрут и юридическая чистота объекта."
          - paragraph [ref=f2e277]: "Отдельно выделяется свежая вторичка в уже сданных домах: покупатель получает более современную среду без ожидания завершения строительства."
        - figure "Карта Аксая помогает заранее оценить расположение жилых районов, выездов и повседневных маршрутов." [ref=f2e278]:
          - img "Карта жилых районов и центральных улиц Аксая для выбора квартиры" [ref=f2e279]
      - heading "Коротко о рынке" [level=3] [ref=f2e281]
