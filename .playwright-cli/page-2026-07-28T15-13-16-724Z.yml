      - paragraph [ref=f3e9]: Актуально на 26 марта 2026 г.
      - generic [ref=f3e10]:
        - heading "1. Общие положения" [level=2] [ref=f3e11]
        - paragraph [ref=f3e12]: Настоящая политика обработки персональных данных составлена в соответствии с требованиями Федерального закона от 27.07.2006. № 152-ФЗ «О персональных данных» и определяет порядок обработки персональных данных и меры по обеспечению безопасности персональных данных, предпринимаемые АН «Домиан Квартал» (далее – Оператор).
        - paragraph [ref=f3e13]: 1.1. Оператор ставит своей важнейшей целью и условием осуществления своей деятельности соблюдение прав и свобод человека и гражданина при обработке его персональных данных, в том числе защиты прав на неприкосновенность частной жизни, личную и семейную тайну.
        - paragraph [ref=f3e14]:
          - text: 1.2. Настоящая политика Оператора в отношении обработки персональных данных (далее – Политика) применяется ко всей информации, которую Оператор может получить о посетителях веб-сайта
          - strong [ref=f3e15]: https://domian-161.ru
          - text: .
        - heading "2. Основные понятия" [level=2] [ref=f3e16]
        - paragraph [ref=f3e17]:
          - text: 2.1.
          - strong [ref=f3e18]: Персональные данные
          - text: — любая информация, относящаяся прямо или косвенно к определенному или определяемому Пользователю веб-сайта.
        - paragraph [ref=f3e19]:
          - text: 2.2.
          - strong [ref=f3e20]: Обработка персональных данных
          - text: — любое действие (операция) или совокупность действий (операций), совершаемых с использованием средств автоматизации или без использования таких средств с персональными данными.
        - paragraph [ref=f3e21]:
          - text: 2.3.
          - strong [ref=f3e22]: Конфиденциальность персональных данных
          - text: — обязательное для соблюдения Оператором или иным получившим доступ к персональным данным лицом требование не допускать их распространения без согласия субъекта персональных данных.
        - heading "3. Цели обработки персональных данных" [level=2] [ref=f3e23]
        - paragraph [ref=f3e24]: "3.1. Цель обработки персональных данных Пользователя:"
        - list [ref=f3e25]:
          - listitem [ref=f3e26]: информирование Пользователя посредством отправки электронных писем;
          - listitem [ref=f3e27]: заключение, исполнение и прекращение гражданско-правовых договоров;
          - listitem [ref=f3e28]: предоставление доступа Пользователю к сервисам, информации и/или материалам, содержащимся на веб-сайте;
          - listitem [ref=f3e29]: уточнение деталей заказа;
          - listitem [ref=f3e30]: связь с клиентом для подтверждения заявки на консультацию.
        - heading "4. Правовые основания обработки" [level=2] [ref=f3e31]
        - paragraph [ref=f3e32]:
          - text: 4.1. Оператор обрабатывает персональные данные Пользователя только в случае их заполнения и/или отправки Пользователем самостоятельно через специальные формы, расположенные на сайте
          - strong [ref=f3e33]: https://domian-161.ru
          - text: . Заполняя соответствующие формы и/или отправляя свои персональные данные Оператору, Пользователь выражает свое согласие с данной Политикой.
        - paragraph [ref=f3e34]: 4.2. Оператор обрабатывает обезличенные данные о Пользователе в случае, если это разрешено в настройках браузера Пользователя (включено сохранение файлов «cookie» и использование технологии JavaScript).
        - heading "5. Порядок сбора, хранения, передачи и других видов обработки персональных данных" [level=2] [ref=f3e35]
        - paragraph [ref=f3e36]: 5.1. Безопасность персональных данных, которые обрабатываются Оператором, обеспечивается путем реализации правовых, организационных и технических мер, необходимых для выполнения в полном объеме требований действующего законодательства.
        - paragraph [ref=f3e37]: 5.2. Оператор обеспечивает сохранность персональных данных и принимает все возможные меры, исключающие доступ к персональным данным неуполномоченных лиц.
        - paragraph [ref=f3e38]: 5.3. Персональные данные Пользователя никогда, ни при каких условиях не будут переданы третьим лицам, за исключением случаев, связанных с исполнением действующего законодательства.
        - paragraph [ref=f3e39]: 5.4. Срок обработки персональных данных является неограниченным. Пользователь может в любой момент отозвать свое согласие на обработку персональных данных, направив уведомление Оператору.
