      - heading "Что проверить перед покупкой квартиры" [level=3] [ref=f2e126]
      - list [ref=f2e127]:
        - listitem [ref=f2e128]: Актуальную выписку ЕГРН по объекту.
        - listitem [ref=f2e129]: Состав собственников и основания владения квартирой.
